name: Flowlu CRM Actions Build Check

on:
  push:
    branches:
      - flowlu-crm-actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
